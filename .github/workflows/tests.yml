name: Tests

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    # Pin the image: ubuntu-latest is 26.04, which has no setup-python build
    # for Python 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install quantumrandom
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,numpy]'

      # These never touch the network, so no API key is needed
      - name: Run tests
        run: pytest -q

  build:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
